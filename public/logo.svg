<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- XAN "Guiding Light" mark — inspired by SUNDEEP (सन्दीप, "a lighted lamp").
       Four light beams form the X of XAN around a central lamp spark.
       Static twin of src/web/components/Logo.tsx (default brand values). -->
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="h" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="13.5" fill="url(#t)"/>
  <rect x="1" y="1" width="46" height="46" rx="13.5" fill="url(#s)"/>
  <rect x="1.9" y="1.9" width="44.2" height="44.2" rx="12.6" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1.4"/>
  <circle cx="24" cy="24" r="11.5" fill="url(#h)"/>
  <g stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" fill="none">
    <path d="M17.6 17.6 12.4 12.4"/>
    <path d="M30.4 17.6 35.6 12.4"/>
    <path d="M17.6 30.4 12.4 35.6"/>
    <path d="M30.4 30.4 35.6 35.6"/>
  </g>
  <path d="M24 16.2 Q25.35 22.65 31.8 24 Q25.35 25.35 24 31.8 Q22.65 25.35 16.2 24 Q22.65 22.65 24 16.2 Z" fill="#ffffff"/>
</svg>
