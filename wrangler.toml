name = "xancld"
main = "src/worker/index.ts"
# B8: refreshed from 2025-01-01 so the worker runtime gets current fixes
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# B8: upstream provider domains are config now (see src/worker/runtimeConfig.ts).
# When a provider rotates domains, change them here (or in the CF dashboard)
# instead of editing code. Defaults live in runtimeConfig.ts.
[vars]
ALLANIME_API = "https://api.allanime.day/api"
MKISSA_ORIGIN = "https://mkissa.to"
ZEN_HOST = "https://flixcloud.cc"
# mkissa.net signed episode API (aaReq scheme) — bump AA_BUILD_ID when the
# frontend deploy rotates its build (see src/worker/allanimeCrypto.ts header)
AA_API = "https://api.mkissa.net/api"
AA_BOOTSTRAP = "https://api.mkissa.net/client-crypto/v1/bootstrap"
AA_BUILD_ID = "186"
AA_LANE = "k7"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true
